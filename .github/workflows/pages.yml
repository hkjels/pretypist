name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI
        working-directory: ${{ runner.temp }}
        env:
          CLOJURE_CLI_VERSION: 1.12.6.1673
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output clojure-linux-install.sh \
            "https://github.com/clojure/brew-install/releases/download/$CLOJURE_CLI_VERSION/linux-install.sh"
          echo '5ae63b082ed33bf4c29bf1a8317c5c15249d1bc753676b2f5177fb3804ad6f77  clojure-linux-install.sh' | sha256sum --check
          bash clojure-linux-install.sh --prefix "$RUNNER_TEMP/clojure"
          echo "$RUNNER_TEMP/clojure/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run unit and package tests
        run: npm test

      - name: Build and audit the production PWA
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: resources/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
